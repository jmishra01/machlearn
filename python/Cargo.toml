[package]
name = "machlearn-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "machlearn"
crate-type = ["cdylib"]

[dependencies]
machlearn = { path = ".." }
ndarray = "0.17"
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["extension-module"] }
